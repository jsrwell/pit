[alembic]
script_location = %(here)s/alembic
prepend_sys_path = src
path_separator = os
revision_environment = true
truncate_slug_length = 40

# The revision id is stamped as AAAAMMDD_HHMM by env.py, so this template
# yields AAAAMMDD_HHMM_slug.py. The DSN is read from Settings in env.py.
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]
hooks = ruff, black
ruff.type = module
ruff.module = ruff
ruff.options = check --fix REVISION_SCRIPT_FILENAME
black.type = console_scripts
black.entrypoint = black
black.options = --quiet REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
